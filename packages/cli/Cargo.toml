[package]
name = "fa"
version = "0.1.0"
authors = ["Matthieu Gindre 'Gin Quin' <gin.the.quin@gmail.com>"]
edition = "2024"
description = "The `fa` command: check, build and run Fa programs"

[[bin]]
name = "fa"
path = "src/main.rs"

# the LLVM backend, run by `fa` for the native and wasm targets (`src/native.rs`):
# the only binary that links libLLVM
[[bin]]
name = "fa-native"
path = "src/native_main.rs"

[dependencies]
fa-analyzer = { path = "../analyzer" }
fa-codebase-parser = { path = "../codebase-parser" }
fa-codegen-js = { path = "../codegen-js" }
fa-codegen-llvm = { path = "../codegen-llvm" }
fa-formatter = { path = "../formatter" }
fa-interpreter = { path = "../interpreter" }
fa-parser = { path = "../parser" }
