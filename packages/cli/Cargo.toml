[package]
name = "fa"
version = "0.1.0"
authors = ["Matthieu Gindre 'Gin Quin' <gin.the.quin@gmail.com>"]
edition = "2024"
description = "The `fa` command: check, build and run Fa programs"

[[bin]]
name = "fa"
path = "src/main.rs"

[dependencies]
fa-analyzer = { path = "../analyzer" }
fa-codegen-js = { path = "../codegen-js" }
fa-codegen-llvm = { path = "../codegen-llvm" }
